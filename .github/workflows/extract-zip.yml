name: Extract source zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir y subir
        run: |
          test -f slendytubbies-ps2-coop-src.zip || { echo "::error::Sube slendytubbies-ps2-coop-src.zip a la raiz del repositorio."; exit 1; }
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q slendytubbies-ps2-coop-src.zip -d /tmp/x
          rm -rf /tmp/x/slendytubbies-ps2-main/.github
          cp -r /tmp/x/slendytubbies-ps2-main/. .
          rm -f slendytubbies-ps2-coop-src.zip
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Agregar actualizacion co-op desde el zip" || echo "Nada que subir"
          git push
